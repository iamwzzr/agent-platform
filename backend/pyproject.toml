[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
